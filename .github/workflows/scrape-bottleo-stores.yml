name: Refresh Bottle-O store list

on:
  schedule:
    # Monthly — store openings/closures are rare, and every run re-geocodes
    # any new address through Nominatim's rate-limited free API, so there's
    # no reason to run this on the same schedule as the price scrapers.
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

jobs:
  refresh-bottleo-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Bottle-O store list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scrape_bottleo_stores.py

      - name: Commit updated bottleo_stores.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bottleo_stores.json
          git diff --staged --quiet || git commit -m "Refresh Bottle-O store list"
          git push
