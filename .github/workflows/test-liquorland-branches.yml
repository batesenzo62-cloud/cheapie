name: TEMP - test chunked Liquorland branch scraper

on:
  workflow_dispatch: {}

jobs:
  liquorland-branches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Liquorland branches (chunk ${{ matrix.chunk }}/8)
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: 8
        run: python3 -u scrape_liquorland_branches.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py
