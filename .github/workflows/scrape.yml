name: Scrape independent stores and refresh prices

on:
  schedule:
    # Every 4 hours — a starting point within the 3-6h range, kept polite
    # to the retailers we're scraping. Adjust if it turns out too often
    # or not often enough. Firecrawl chain-store scraping runs on its own,
    # much rarer schedule — see scrape-chain-stores.yml — since it costs
    # real API credits and this one doesn't.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape independent stores
        run: python3 scrape_independent_stores.py

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py
