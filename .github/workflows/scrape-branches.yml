name: Scrape per-branch chains and refresh prices

# 2026-08-13 fix: this used to be one sequential job — scrape all 5 chains
# into a shared CSV, then load once at the end. Confirmed directly: Bottle-O's
# freshest data was stuck at 2026-08-03 (9+ days stale) even though this
# workflow runs daily, because Super Liquor (147 branches, each needing up
# to 250 pages to reach real catalogue depth — see MAX_PAGES_PER_TARGET in
# scrape_independent_stores.py) can legitimately take several hours, and a
# single slow/stuck step blocks every chain listed after it in the same
# job from ever running at all. Split into independent parallel jobs, each
# scraping and loading just its own chain, so a slow Super Liquor no
# longer blocks Liquorland/Thirsty/Black Bull/Bottle-O from refreshing on
# schedule. load_data_to_supabase.py already handles a missing CSV
# gracefully (skips it, loads whatever's actually present), so each job
# only ever has its own chain's fresh file in a clean checkout — no
# cross-job file sharing needed.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  liquorland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Liquorland (full catalogue, no per-branch pricing — see scrape_liquorland_full.py)
        run: python3 scrape_liquorland_full.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py

  thirsty-liquor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Thirsty Liquor branches
        run: python3 scrape_thirsty_branches.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py

  super-liquor:
    runs-on: ubuntu-latest
    # 2026-08-13 fix: confirmed directly — a single job covering all 147
    # online branches got killed at exactly 6h00m by GitHub Actions' hard
    # job time limit for hosted runners. timeout-minutes can be set higher
    # (it was 480 here) but can't actually raise that platform ceiling —
    # it's silently capped, not honoured. Split into 6 parallel chunks
    # instead (see CHUNK_INDEX/CHUNK_COUNT in scrape_superliquor_branches.py
    # — [start::step] slicing, so no chunk is skewed if catalogue depth
    # varies regionally), each comfortably inside the real limit.
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Super Liquor branches (chunk ${{ matrix.chunk }}/6)
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: 6
        run: python3 scrape_superliquor_branches.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py

  black-bull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Black Bull branches
        run: python3 scrape_blackbull_branches.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py

  bottle-o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Bottle-O branches
        run: python3 scrape_bottleo_products.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py
