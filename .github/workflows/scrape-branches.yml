name: Scrape per-branch chains and refresh prices

on:
  schedule:
    # Daily rather than the independent-store workflow's every-4-hours —
    # this covers ~250 branches total across Liquorland, Thirsty Liquor,
    # Super Liquor, Black Bull, and Bottle-O, each requiring its own
    # request(s). Running that volume every 4 hours would be a lot more
    # load on these retailers' sites than is polite for data that mostly
    # doesn't change that fast anyway.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  scrape-branches-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Liquorland (full catalogue, no per-branch pricing — see scrape_liquorland_full.py)
        run: python3 scrape_liquorland_full.py

      - name: Scrape Thirsty Liquor branches
        run: python3 scrape_thirsty_branches.py

      - name: Scrape Super Liquor branches
        run: python3 scrape_superliquor_branches.py

      - name: Scrape Black Bull branches
        run: python3 scrape_blackbull_branches.py

      - name: Scrape Bottle-O branches
        run: python3 scrape_bottleo_products.py

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py
