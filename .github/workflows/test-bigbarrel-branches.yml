name: TEMP - diagnose Big Barrel branch scrape timing

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Diagnose timing
        run: python3 diagnose_bigbarrel_timing.py
