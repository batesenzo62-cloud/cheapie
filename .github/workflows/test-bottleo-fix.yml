name: TEMP - test Bottle-O load fix

on:
  workflow_dispatch: {}

jobs:
  bottle-o:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Scrape Bottle-O branches
        run: python3 scrape_bottleo_products.py
      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 -u load_data_to_supabase.py
