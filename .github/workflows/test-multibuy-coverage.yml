name: Test - Multi-buy Coverage Check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python check_multibuy_coverage.py
      - run: python check_multibuy_coverage2.py
      - run: mkdir -p banner_images && python dl_banner_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: banner-images
          path: banner_images/
