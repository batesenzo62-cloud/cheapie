name: Scrape chain stores (Firecrawl)

on:
  schedule:
    # Monthly, timed to use the free-tier credit refresh once it lands
    # rather than trickling requests out (and hitting 402s) all month.
    # Defaulted to the 1st of the month — adjust the day-of-month below
    # once you've confirmed your actual Firecrawl reset date from the
    # dashboard (Settings -> Billing/Usage). Cron format: min hour dom
    # month dow.
    - cron: '0 0 1 * *'
  workflow_dispatch: {}

jobs:
  scrape-chain-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape chain stores (Firecrawl)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python3 scrape_chain_stores_firecrawl.py

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 load_data_to_supabase.py
