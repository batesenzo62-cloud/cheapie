name: One-off - check Bottle-O branches marked offline

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check offline-marked branches
        run: python3 check_bottleo_offline_branches.py
