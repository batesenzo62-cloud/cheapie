name: One-off - check Thirsty Liquor branches with no catalogue

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check for missed branch websites
        run: python3 check_thirsty_missing_branches.py
