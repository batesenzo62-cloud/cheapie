name: Refresh New World / PAK'nSAVE store list

on:
  schedule:
    # Monthly — store openings/closures are rare, and every run refetches
    # each store's page individually, so there's no reason to run this on
    # the same schedule as the price scrapers.
    - cron: '0 4 1 * *'
  workflow_dispatch: {}

jobs:
  refresh-supermarket-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh New World / PAK'nSAVE store list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scrape_supermarket_stores.py

      - name: Commit updated supermarket_stores.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supermarket_stores.json
          git diff --staged --quiet || git commit -m "Refresh New World / PAK'nSAVE store list"
          git push
